<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result - Quiz Arena</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page-container">

        <nav class="navbar">

            <h2>Quiz Arena</h2>

            <a href="home.html">Home</a>

        </nav>


        <main class="result-container">

            <div class="result-card">

                <div class="result-icon">
                    🏆
                </div>

                <p class="small-heading">
                    QUIZ COMPLETED
                </p>

                <h1>Your Result</h1>

                <p id="resultCategory">
                    Category
                </p>


                <div class="score-box">

                    <span id="score">
                        0
                    </span>

                    <span>
                        / 10
                    </span>

                </div>


                <p id="resultMessage">
                    Great job!
                </p>


                <button id="tryAgainBtn">
                    Try Again
                </button>


                <button id="homeBtn" class="secondary-btn">
                    Back to Home
                </button>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
