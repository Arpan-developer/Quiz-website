<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Quiz Arena</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page-container">

        <nav class="navbar">

            <h2>Quiz Arena</h2>

            <a href="home.html">Exit Quiz</a>

        </nav>


        <main class="quiz-container">


            <div class="quiz-header">

                <p id="categoryName">Category</p>

                <h3 id="questionNumber">
                    Question 1 / 10
                </h3>

            </div>


            <div class="quiz-card">

                <h1 id="question">
                    Question will appear here
                </h1>


                <div class="answers">

                    <button class="answerBtn" id="optionA">
                        A. Option A
                    </button>

                    <button class="answerBtn" id="optionB">
                        B. Option B
                    </button>

                    <button class="answerBtn" id="optionC">
                        C. Option C
                    </button>

                    <button class="answerBtn" id="optionD">
                        D. Option D
                    </button>

                </div>


                <p id="feedback"></p>


                <button id="nextBtn">
                    Next →
                </button>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
